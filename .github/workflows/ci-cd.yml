name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Continuous Integration (Lint, Type Check & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Build Next.js project
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  cd:
    name: Continuous Deployment (Production Delivery)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js artifact
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Log Deployment Status
        run: |
          echo "========================================="
          echo "CI/CD Pipeline Validation Passed Successfully!"
          echo "Main branch build ready for deployment."
          echo "========================================="
